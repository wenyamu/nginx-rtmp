<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx HTTP-FLV 低延迟直播演示</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 flv.js -->
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-live { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-offline { background-color: #6b7280; }
        .btn-primary {
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl glass-panel rounded-xl p-6 md:p-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-tower-broadcast text-pink-500"></i>
                    低延迟直播监控
                </h1>
                <p class="text-gray-400 text-sm mt-1">基于 Nginx HTTP-FLV Module + flv.js</p>
            </div>
            <div class="flex items-center gap-2 bg-black/20 px-3 py-1 rounded-full">
                <span id="statusDot" class="status-dot status-offline"></span>
                <span id="statusText" class="text-xs font-mono text-gray-300">未连接</span>
            </div>
        </div>

        <!-- Video Player Area -->
        <div class="video-container shadow-2xl border border-gray-700 mb-6 group">
            <video id="videoElement" controls muted autoplay></video>
            <!-- Overlay for loading/errors could go here -->
        </div>

        <!-- Controls & Info -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Connection Settings -->
            <div class="md:col-span-2 space-y-4">
                <div class="bg-black/20 p-4 rounded-lg border border-gray-700">
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">直播流地址 (HTTP-FLV)</label>
                    <div class="flex gap-2">
                        <input type="text" id="streamUrl" value="http://localhost/live-flv?app=show-flv&stream=abc123456" 
                               class="flex-1 bg-gray-800 border border-gray-600 text-white text-sm rounded px-3 py-2 focus:outline-none focus:border-pink-500 transition-colors"
                               placeholder="http://ip/live?app=live&stream=xxx">
                        <button onclick="startPlay()" class="btn-primary text-white px-4 py-2 rounded text-sm font-medium flex items-center gap-2">
                            <i class="fa-solid fa-play"></i> 播放
                        </button>
                        <button onclick="stopPlay()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm font-medium transition-colors">
                            <i class="fa-solid fa-stop"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">
                        <i class="fa-solid fa-circle-info mr-1"></i>
                        确保 Nginx 已配置 <code class="bg-gray-800 px-1 rounded text-pink-400">flv_live on;</code> 且推流正常。
                    </p>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-black/20 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-400">延迟估算</div>
                        <div class="text-lg font-mono text-green-400" id="latencyEst">-- ms</div>
                    </div>
                    <div class="bg-black/20 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-400">视频分辨率</div>
                        <div class="text-lg font-mono text-blue-400" id="resolution">-- x --</div>
                    </div>
                    <div class="bg-black/20 p-3 rounded border border-gray-700">
                        <div class="text-xs text-gray-400">状态</div>
                        <div class="text-lg font-mono text-yellow-400" id="playerState">Idle</div>
                    </div>
                </div>
            </div>

            <!-- Help / Tips -->
            <div class="bg-black/20 p-4 rounded-lg border border-gray-700 text-sm text-gray-300">
                <h3 class="font-bold text-white mb-2"><i class="fa-solid fa-lightbulb text-yellow-500 mr-1"></i> 调试提示</h3>
                <ul class="space-y-2 list-disc list-inside text-xs">
                    <li>推流地址: <code class="text-pink-400">rtmp://ip/live/test</code></li>
                    <li>拉流地址: <code class="text-pink-400">http://ip/live?app=live&stream=test</code></li>
                    <li>若播放黑屏，请检查 Nginx 是否开启 <code class="text-gray-400">gop_cache on;</code></li>
                    <li>浏览器控制台查看 <code class="text-gray-400">flv.js</code> 日志排查错误。</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        let flvPlayer = null;
        const videoElement = document.getElementById('videoElement');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const playerState = document.getElementById('playerState');
        const resolution = document.getElementById('resolution');

        // 初始化播放器
        function initPlayer() {
            if (flvjs.isSupported()) {
                console.log('flv.js is supported');
            } else {
                alert('您的浏览器不支持 flv.js (需要 Media Source Extensions)');
            }
        }

        function startPlay() {
            const url = document.getElementById('streamUrl').value;
            if (!url) return;

            stopPlay(); // 先停止之前的

            if (flvjs.isSupported()) {
                flvPlayer = flvjs.createPlayer({
                    type: 'flv',
                    url: url,
                    isLive: true,
                    hasAudio: true,
                    hasVideo: true,
                    enableStashBuffer: false, // 降低延迟的关键配置：禁用内部缓冲
                    stashInitialSize: 128,    // 初始缓冲区大小
                });

                flvPlayer.attachMediaElement(videoElement);
                
                // 事件监听
                flvPlayer.on(flvjs.Events.ERROR, (errorType, errorDetail, errorInfo) => {
                    console.error('player error:', errorType, errorDetail, errorInfo);
                    updateStatus('error', '播放错误');
                    playerState.innerText = "Error";
                });

                flvPlayer.on(flvjs.Events.MEDIA_INFO, (info) => {
                    console.log('media info:', info);
                    resolution.innerText = `${info.width} x ${info.height}`;
                });

                flvPlayer.on(flvjs.Events.METADATA_ARRIVED, (metadata) => {
                     console.log('metadata arrived');
                });

                try {
                    flvPlayer.load();
                    flvPlayer.play();
                    updateStatus('live', '直播中');
                    playerState.innerText = "Playing";
                } catch (e) {
                    console.error(e);
                    updateStatus('offline', '启动失败');
                }
            }
        }

        function stopPlay() {
            if (flvPlayer) {
                flvPlayer.pause();
                flvPlayer.unload();
                flvPlayer.detachMediaElement();
                flvPlayer.destroy();
                flvPlayer = null;
            }
            updateStatus('offline', '已停止');
            playerState.innerText = "Stopped";
            resolution.innerText = "-- x --";
        }

        function updateStatus(type, text) {
            statusText.innerText = text;
            if (type === 'live') {
                statusDot.className = 'status-dot status-live';
            } else {
                statusDot.className = 'status-dot status-offline';
            }
        }

        // 页面加载完成后初始化
        window.onload = initPlayer;
    </script>
</body>
</html>
