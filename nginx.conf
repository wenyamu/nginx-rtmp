
worker_processes  1;

events {
    worker_connections  1024;
}

# RTMP 实时消息传输协议配置
rtmp {
    server {
        listen 1935; # 监听标准RTMP端口
        chunk_size 4000;
        
        #修改后需要重新推流并重启nginx 才会生效 /usr/local/nginx/sbin/nginx -s reload
        application show {
            live on;
            
            #自动录制，视频和音频, 用于监测移动物体时合成使用 10秒钟一个文件
            recorder auto_full_10 {
              record off; # 自动录制，all 开启视频和音频; video 开启视频; audio 开启音频; off 关闭
              record_path /mnt/recordings; # 指定存储路径
              #record_unique on;        # 文件名加时间戳，相当于自定义中的 %s，避免覆盖
              
              #record_suffix .flv; # 指定后缀名（可选，开启时间戳时，默认名是 推流码-1789636031.flv）
              record_suffix -%Y%m%d-%H%M%S.flv; # 自定义文件名格式（可选，开启时间戳时，默认是 推流码-1789636031-自定义.flv）
              
              #这二个同时启用好像有点问题，好像不是连续录，后续再研究把前后两个视频拼起来看是否连续
              record_interval 10; # 录制单个文件的时长（秒）自动切割一次文件，仅自动录制时有效
              #record_max_size 10M; # 每个文件最大 10MB，超过后自动新建文件，仅自动录制时有效
              
            }
            
            #自动录制，视频和音频 用于正常的监控备份 1分钟一个文件
            recorder auto_full_60 {
              record off; # 自动录制，all 开启视频和音频; video 开启视频; audio 开启音频; off 关闭
              record_path /mnt/back_recordings; # 指定存储路径
              record_unique on;        # 文件名加时间戳，相当于自定义中的 %s，避免覆盖
              
              #record_suffix .flv; # 指定后缀名（可选，开启时间戳时，默认名是 推流码-1789636031.flv）
              #record_suffix -%Y%m%d-%H%M%S.flv; # 自定义文件名格式（可选，开启时间戳时，默认是 推流码-1789636031-自定义.flv）
              
              #这二个同时启用好像有点问题，好像不是连续录，后续再研究把前后两个视频拼起来看是否连续
              record_interval 60; # 录制单个文件的时长（秒）自动切割一次文件，仅自动录制时有效
              #record_max_size 10M; # 每个文件最大 10MB，超过后自动新建文件，仅自动录制时有效
              
            }
            
            #手动录制，视频和音频 all
            recorder full_rec {
              record all manual; # 手动录制
              record_path /mnt/manual_recordings; # 指定存储路径
              record_unique on;        # 文件名加时间戳，相当于自定义中的 %s，避免覆盖
              #record_suffix .flv; # 指定后缀名（可选，开启时间戳时，默认名是 推流码-1789636031.flv）
              #record_suffix -%Y%m%d-%H%M%S.av.flv; # 自定义文件名格式（可选，开启时间戳时，默认是 推流码-1789636031-自定义.flv）
            }
            
            #手动录制，只录制视频无音频 video
            recorder video_rec {
              record video manual; # 手动录制
              record_path /mnt/manual_recordings; # 指定存储路径
              record_unique on;        # 文件名加时间戳，相当于自定义中的 %s，避免覆盖
              #record_suffix .flv; # 指定后缀名（可选，开启时间戳时，默认名是 推流码-1789636031.flv）
              record_suffix -%Y%m%d-%H%M%S.v.flv; # 自定义文件名格式（可选，开启时间戳时，默认是 推流码-1789636031-自定义.flv）
            }
            
            #手动录制，只录制音频 audio
            recorder audio_rec {
              record audio manual; # 手动录制
              record_path /mnt/manual_recordings; # 指定存储路径
              record_unique on; # 文件名加时间戳，相当于自定义中的 %s，避免覆盖
              #record_suffix .flv; # 指定后缀名（可选，开启时间戳时，默认名是 推流码-1789636031.flv）
              record_suffix -%Y%m%d-%H%M%S.a.flv; # 自定义文件名格式（可选，开启时间戳时，默认是 推流码-1789636031-自定义.flv）
            }
            
            hls on; # 开启HLS, 生成 .ts 和 .m3u8
            hls_path /mnt/hls/; # HLS 切片存放路径
            hls_fragment 5; # 每个切片时长（秒），越小延迟越低，但请求越多
            hls_playlist_length 60; # 设置 HLS 播放列表（推流码.m3u8 文件）中包含的视频总时长（秒）
            # 禁用以 RTMP 协议从 Nginx 服务器拉取视频流。禁用后无法通过 VLC播放器、http网页播放器观看直播
            #deny play all;
        }
        
        application show-flv {
            live on;
            record off;
            
            # 开启 GOP 缓存，实现秒开
            # 新观众加入时，服务器会立即发送最近的一个关键帧组，避免黑屏等待
            gop_cache on;
            
            # HLS 配置 (保留作为兼容或录制用途)
            hls on;
            hls_path /mnt/hls2/;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_sync 100ms;
            
            # 其他优化
            wait_key on;
            wait_video on;
        }
        
        
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       81;
        server_name  localhost;

        #access_log  logs/host.access.log  main;

        location / {
            root   /mnt/;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
        
        # 推流地址：rtmp://your-ip/show-flv/abc123456
        # HTTP-FLV 拉流地址: http://your-ip/live-flv?app=show-flv&stream=abc123456
        # 注意：http://your-ip/live-flv 不能直接打开，专用于 HTTP-FLV 拉流使用
        location /live-flv {
            flv_live on; #打开 HTTP 播放 FLV 直播流功能
            chunked_transfer_encoding on; #支持 'Transfer-Encoding: chunked' 方式回复
            
            add_header 'Access-Control-Allow-Origin' '*'; #添加额外的 HTTP 头
            add_header 'Access-Control-Allow-Credentials' 'true'; #添加额外的 HTTP 头
        }
        
    
    }

    server {
        listen 81;
        
        # 配置控制接口
        location /control {
            rtmp_control all;
        }
        
        # 可选：查看统计信息
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /mnt/; # stat.xsl 文件的存放目录，此文件是从编译时下载的 nginx-rtmp-module-src 目录下复制过来的
            
            # 强制设置 Content-Type 为 text/xml，告诉浏览器这是可阅读的 XML，防止下载
            default_type text/xml;
            
            # 或者使用 add_header (注意：如果 default_type 生效，add_header 可能不需要，但加上更保险)
            add_header Content-Type "text/xml; charset=utf-8";
        }
    }
    

}
